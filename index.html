<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="6;url=home.html">
<title>RHCSA Exam Preparation - RHEL 9</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #1a0000 0%, #000 70%);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  /* full-screen scanline texture behind the stage, so the backdrop around
     it (on any screen shape) matches the stage's own CRT look */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
      transparent 2px, transparent 4px
    );
    pointer-events: none;
  }
  /* fixed 1280x720 design, scaled as one unit to fit the viewport (see
     fitStage() in the script below) - keeps every element's relative size
     and position identical to the original design at any screen size */
  #stage {
    position: relative;
    width: 1280px; height: 720px;
    flex-shrink: 0;
    transform-origin: center center;
    background: radial-gradient(circle at center, #1a0000 0%, #000 70%);
    overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* CRT-style scanline texture */
  #stage::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px,
      transparent 2px, transparent 4px
    );
    pointer-events: none;
  }
  /* boot-up flicker sweep, timed to the title's reveal (see delays below) */
  #stage::after {
    content: "";
    position: absolute; left: 0; right: 0; top: -20%;
    height: 20%;
    background: linear-gradient(to bottom, rgba(238,0,0,0.35), transparent);
  }
  #stage.ready::after {
    animation: sweep 0.5s ease-out 2.25s forwards;
  }
  @keyframes sweep { to { top: 120%; } }

  /* Badge: pops in big below the logo, then shrinks down to its footer spot */
  #badgeHero {
    position: absolute;
    left: 640px; top: 499px;
    width: 10px; height: 10px;
    transform: translate(-50%, -50%);
    opacity: 0;
    border-radius: 18px;
    pointer-events: none;
    filter: drop-shadow(0 0 0 rgba(238,0,0,0));
  }
  #stage.ready #badgeHero {
    animation: heroBadge 1.6s 0.05s forwards;
  }
  @keyframes heroBadge {
    0%   { left: 640px; top: 499px; width: 10px;  height: 10px;  opacity: 0; filter: drop-shadow(0 0 0 rgba(238,0,0,0)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
    44%  { left: 640px; top: 499px; width: 380px; height: 380px; opacity: 1; filter: drop-shadow(0 0 55px rgba(238,0,0,0.7)); animation-timing-function: ease-in-out; }
    63%  { left: 640px; top: 499px; width: 380px; height: 380px; opacity: 1; filter: drop-shadow(0 0 55px rgba(238,0,0,0.7)); animation-timing-function: ease-in-out; }
    90%  { left: 344px; top: 641px; width: 40px;  height: 40px;  opacity: 1; filter: drop-shadow(0 0 8px rgba(238,0,0,0.4)); }
    100% { left: 344px; top: 641px; width: 40px;  height: 40px;  opacity: 0; filter: drop-shadow(0 0 8px rgba(238,0,0,0.4)); }
  }

  /* Logo: pops in at its normal centered spot, in sync with the badge below it */
  #logo {
    width: 220px; height: 220px;
    opacity: 0; transform: scale(0.4) rotate(-25deg);
    filter: drop-shadow(0 0 25px rgba(238,0,0,0.8));
  }
  #stage.ready #logo {
    animation: pop 0.7s cubic-bezier(.34,1.56,.64,1) 0.05s forwards,
               breathe 2.4s ease-in-out 1.65s infinite;
  }
  @keyframes pop { to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 0 22px rgba(238,0,0,0.75)); }
    50% { filter: drop-shadow(0 0 42px rgba(238,0,0,1)); }
  }

  #titleWrap { position: relative; margin-top: 26px; }
  #title {
    font-size: 78px;
    font-weight: 800;
    letter-spacing: 22px;
    color: #ee0000;
    text-shadow: 0 0 10px rgba(238,0,0,0.9), 0 0 30px rgba(238,0,0,0.6);
    opacity: 0;
    transform: translateY(20px);
    text-align: center;
    line-height: 1.15;
  }
  #stage.ready #title {
    animation: titleIn 0.75s cubic-bezier(.2,.8,.2,1) 2.25s forwards;
  }
  @keyframes titleIn {
    to { opacity: 1; transform: translateY(0); letter-spacing: 6px; }
  }
  /* separate overlay so the sweep clips without cutting off the title's glow */
  #shineOverlay {
    position: absolute; inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #shineOverlay::after {
    content: "";
    position: absolute; top: 0; left: -60%; width: 35%; height: 100%;
    background: linear-gradient(75deg, transparent, rgba(255,255,255,0.6), transparent);
    transform: skewX(-20deg);
    opacity: 0;
  }
  #stage.ready #shineOverlay::after {
    animation: shine 0.6s ease-in-out 3s forwards;
  }
  @keyframes shine {
    0% { left: -60%; opacity: 0; }
    15% { opacity: 1; }
    100% { left: 130%; opacity: 0; }
  }

  #tagline {
    margin-top: 18px;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: 5px;
    color: #ddd;
    text-transform: uppercase;
    opacity: 0;
    transform: translateY(14px);
  }
  #stage.ready #tagline {
    animation: riseIn 0.55s ease-out 3.05s forwards;
  }
  @keyframes riseIn { to { opacity: 1; transform: translateY(0); } }

  #terminalLine {
    margin-top: 16px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 22px;
    color: #eee;
    white-space: nowrap;
  }
  #subtitle {
    display: inline-block;
    overflow: hidden;
    width: 0;
    vertical-align: middle;
  }
  #stage.ready #subtitle {
    animation: typing 0.6s steps(17, end) 3.65s forwards;
  }
  @keyframes typing { to { width: 17ch; } }

  #cursor {
    display: inline-block;
    width: 12px; height: 24px;
    background: #ee0000;
    margin-left: 4px;
    vertical-align: middle;
    opacity: 0;
  }
  #stage.ready #cursor {
    animation: blink 0.8s steps(1) 3.65s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  #divider {
    margin-top: 22px;
    width: 0; height: 2px;
    background: linear-gradient(90deg, transparent, #ee0000, transparent);
  }
  #stage.ready #divider {
    animation: drawLine 0.45s ease-out 4.3s forwards;
  }
  @keyframes drawLine { to { width: 260px; } }

  #footer {
    margin-top: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #badge {
    height: 40px;
    width: auto;
    opacity: 0;
  }
  #stage.ready #badge {
    animation: fadeIn 0.35s ease-out 1.45s forwards;
  }
  #footer span {
    font-size: 15px;
    letter-spacing: 2px;
    color: #999;
    text-transform: uppercase;
    opacity: 0;
  }
  #stage.ready #footer span {
    animation: fadeIn 0.4s ease-out 1.75s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  @media (max-width: 768px) {
    /* taller canvas on mobile so the relocated badge (below) has room */
    #stage {
      height: 1200px;
      box-sizing: border-box;
      justify-content: flex-start;
      padding-top: 60px;
    }
    #logo {
      width: 320px;
      height: 320px;
    }
    /* stays at its full pop-in size and settles below the footer text,
       instead of shrinking away into the small footer badge - peak sits
       lower than on desktop so it clears the taller mobile logo above it */
    @keyframes heroBadgeMobile {
      0%   { left: 640px; top: 620px; width: 10px;  height: 10px;  opacity: 0; filter: drop-shadow(0 0 0 rgba(238,0,0,0)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
      44%  { left: 640px; top: 620px; width: 380px; height: 380px; opacity: 1; filter: drop-shadow(0 0 55px rgba(238,0,0,0.7)); animation-timing-function: ease-in-out; }
      63%  { left: 640px; top: 620px; width: 380px; height: 380px; opacity: 1; filter: drop-shadow(0 0 55px rgba(238,0,0,0.7)); animation-timing-function: ease-in-out; }
      100% { left: 640px; top: 966px; width: 380px; height: 380px; opacity: 1; filter: drop-shadow(0 0 55px rgba(238,0,0,0.7)); }
    }
    #stage.ready #badgeHero {
      animation-name: heroBadgeMobile;
    }
    /* the big badge now permanently covers this role below the text */
    #badge {
      display: none;
    }
  }
</style>
</head>
<body>
  <div id="stage">
    <img id="badgeHero" src="photos/badge.png" alt="">
    <img id="logo" src="photos/redhat.png" alt="logo">
    <div id="titleWrap">
      <div id="title">FREE RHCSA<br>EXAM SIMULATOR</div>
      <div id="shineOverlay"></div>
    </div>
    <div id="tagline">Mock Exams &amp; Hands-on Labs</div>
    <div id="terminalLine"><span id="subtitle">$ rhcsa.github.io</span><span id="cursor"></span></div>
    <div id="divider"></div>
    <div id="footer">
      <img id="badge" src="photos/badge.png" alt="badge">
      <span>RedHat Certified System Administrator (RHCSA) - EX200 exam</span>
    </div>
  </div>
<script>
// Scale the fixed 1280x720 stage to fit the viewport (letterboxed onto the
// full-screen background on mismatched aspect ratios) - keeps every
// element's relative size and position identical to the original design,
// just displayed larger or smaller as a single unit.
const stage = document.getElementById('stage');

// Scale the stage to fit the viewport, using its own current design size
// (1280x720 on desktop, taller on mobile - see the media query above).
function fitStage() {
  const scale = Math.min(window.innerWidth / stage.offsetWidth, window.innerHeight / stage.offsetHeight);
  stage.style.transform = `scale(${scale})`;
}
fitStage();
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', fitStage);

// Hold the animation start until every photo has actually finished loading.
const photos = Array.from(stage.querySelectorAll('img'));
Promise.all(photos.map((img) => img.complete ? Promise.resolve() : new Promise((resolve) => {
  img.addEventListener('load', resolve, { once: true });
  img.addEventListener('error', resolve, { once: true });
}))).then(() => stage.classList.add('ready'));

// Redirect to the real site after the intro; the meta refresh above covers
// this too when JS is disabled.
setTimeout(() => { window.location.replace('home.html'); }, 6000);
</script>
</body>
</html>
